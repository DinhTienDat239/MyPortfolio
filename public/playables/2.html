<!DOCTYPE html>
<html>
<head>
    <title>Playable Demo 2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0c4a6e;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            gap: 10px;
        }
        .bar {
            width: 20px;
            background: #38bdf8;
            height: 50px;
            animation: bounce 1s ease-in-out infinite alternate;
        }
        @keyframes bounce {
            from { height: 20px; }
            to { height: 100px; }
        }
        h1 { margin-top: 20px; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="bar" style="animation-delay: 0.1s"></div>
        <div class="bar" style="animation-delay: 0.2s"></div>
        <div class="bar" style="animation-delay: 0.3s"></div>
        <div class="bar" style="animation-delay: 0.4s"></div>
        <div class="bar" style="animation-delay: 0.5s"></div>
    </div>
    <h1>Interactive Playable Demo 2</h1>
    <p>Smooth animations for ads!</p>
</body>
</html>
