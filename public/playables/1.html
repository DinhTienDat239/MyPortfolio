<!DOCTYPE html>
<html>
<head>
    <title>Playable Demo 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #082f49;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .box {
            width: 100px;
            height: 100px;
            background: #0ea5e9;
            border-radius: 20px;
            animation: rotate 2s linear infinite;
            cursor: pointer;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        h1 { margin-top: 20px; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div class="box" onclick="this.style.background = '#' + Math.floor(Math.random()*16777215).toString(16)"></div>
    <h1>Interactive Playable Demo 1</h1>
    <p>Click the box to change color!</p>
</body>
</html>
